<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Clawd Pixel Wardrobe</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#21171d;color:#f7ead8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:720px;margin:auto;min-height:100vh;padding:22px 14px 40px;background:radial-gradient(circle at 50% 20%,#6e3c51 0,#38232c 38%,#21171d 78%)}h1{font-size:24px;margin:0 0 5px}header p{margin:0;color:#d7bdad;font-size:13px}.stage{height:360px;margin:18px 0 10px;border:2px solid #c89e5d;border-radius:24px;background:radial-gradient(ellipse at center,#5e4653,#1b141b 70%);box-shadow:inset 0 0 50px #0009,0 10px 32px #0008;display:grid;place-items:center;overflow:hidden}.character{position:relative;width:302px;height:300px;transform:scale(1.05);image-rendering:pixelated}.character img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:none;image-rendering:pixelated}.character img.base,.character img.sel{display:block}.tabs{display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;padding:10px 2px 12px;white-space:nowrap;-webkit-overflow-scrolling:touch;scrollbar-color:#bd8c73 #34232a}.tabs button{flex:none;border:1px solid #b68d76;background:#e5ceb0;color:#533b36;padding:9px 14px;border-radius:5px;font-size:13px}.tabs button.on{background:#873e59;color:white;border-color:#d59ab1}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.item{min-height:64px;border:1px solid #7f5b67;border-radius:12px;background:#36252d;color:#f3e1d2;padding:10px 6px;font-size:12px}.item.on{outline:2px solid #e8bb79;background:#704052}.hint{text-align:center;color:#c9aa9a;font-size:12px;margin-top:14px}@media(max-width:420px){.stage{height:310px}.character{transform:scale(.92)}.grid{grid-template-columns:repeat(3,1fr)}}
</style></head><body><main class="app"><header><h1>Clawd Pixel Wardrobe</h1><p>给像素小螃蟹自由搭配衣服、表情与饰品</p></header><section class="stage"><div class="character" id="character"></div></section><nav class="tabs" id="tabs"></nav><section class="grid" id="grid"></section><p class="hint">搭配会自动保存在当前浏览器中。</p></main><script>
const PRESETS={"maid":{"head":"maid-headdress","neck":"maid-collar","body":"maid-dress","back":"maid-leash","legs":"maid-stockings","face":"maid-blush"},"bunny":{"head":"bunny-ears-fold","neck":"bunny-collar","body":"bunny-shorts","hand":"bunny-cuffs","back":"bunny-tail","legs":"bunny-fishnet","face":"maid-blush"},"cat":{"head":"cat-ears","neck":"maid-collar","hand":"cat-paws","back":"cat-tail","legs":"maid-stockings","face":"maid-blush"},"nurse":{"head":"nurse-cap","neck":"nurse-stetho","body":"nurse-dress","hand":"nurse-syringe","legs":"nurse-stockings","face":"maid-blush"},"lingerie":{"head":"lingerie-bow","body":"lingerie-slip","legs":"lingerie-stockings","face":"maid-blush"},"leather":{"head":"leather-blindfold","neck":"leather-collar","body":"leather-harness","hand":"leather-cuffs","back":"leather-chain","legs":"bunny-fishnet","face":"maid-blush"},"sailor":{"head":"sailor-hat","body":"sailor-dress","neck":"sailor-tie","legs":"nurse-stockings","face":"maid-blush"},"berry":{"head":"berry-bow","body":"berry-apron","neck":"berry-ribbon","legs":"nurse-stockings","face":"maid-blush"},"apron":{"body":"apron-only","face":"blush-heavy"},"naked":{"face":"blush-heavy"},"dream":{"head":"dream-cap","body":"dream-shirt","legs":"dream-socks","face":"maid-blush"},"burgundy-suit":{"body":"suit-burgundy"},"denim":{"body":"denim-overalls"},"magician":{"head":"magician-hat","body":"magician-cape-suit","hand":"magician-wand"},"varsity":{"head":"varsity-cap","body":"varsity-jacket"}};const SLOTS=[["preset","套装",[["denim","卷袖背带裤"],["magician","魔术师礼服"],["varsity","棒球夹克套装"],["maid","男仆装"],["bunny","兔男郎"],["cat","猫男"],["nurse","男护士装"],["lingerie","情趣睡衣"],["leather","皮衣全套"],["sailor","水手服"],["berry","草莓围裙"],["dream","蓝色睡衣"],["apron","只有围裙"],["naked","什么都不穿"],["burgundy-suit","酒红丝绒短外套"]]],["eyes","眼睛",[["eyes-smile","笑眯眯"],["eyes-sleepy","半眯眼"],["eyes-wink","眨眨眼"],["eyes-stars","星星眼"]]],["eyewear","眼饰",[["eye-glasses","细框眼镜"],["eye-monocle","金色单片镜"],["eye-star-sticker","眼角星贴"]]],["head","头上",[["magician-hat","魔术师高礼帽"],["varsity-cap","绿白棒球帽"],["maid-headdress","男仆头饰"],["bunny-ears-up","兔耳·竖"],["bunny-ears-fold","兔耳·折"],["cat-ears","猫耳"],["nurse-cap","男护士帽"],["lingerie-bow","粉蝴蝶结"],["leather-blindfold","眼罩"],["sailor-hat","水手帽"],["berry-bow","草莓蝴蝶结"],["dream-cap","星星睡帽"]]],["neck","脖子",[["maid-collar","红项圈铃铛"],["bunny-collar","粉领结"],["nurse-stetho","听诊器"],["leather-collar","铆钉项圈"],["sailor-tie","水手领结"],["berry-ribbon","豆绿缎带"]]],["body","身上",[["denim-overalls","卷袖背带裤"],["magician-cape-suit","魔术师披风礼服"],["varsity-jacket","棒球夹克"],["maid-dress","男仆装"],["bunny-shorts","黑短裤"],["nurse-dress","男护士服"],["lingerie-slip","粉吊带"],["leather-harness","短款皮衣"],["sailor-dress","水手服"],["berry-apron","草莓围裙"],["dream-shirt","蓝色睡衣"],["apron-only","只有围裙"],["suit-burgundy","酒红丝绒短外套"]]],["hand","手上",[["magician-wand","魔法棒"],["bunny-cuffs","白袖口"],["cat-paws","猫爪手套"],["nurse-syringe","针筒"],["leather-cuffs","皮手铐"]]],["back","身后",[["maid-leash","金链子"],["bunny-tail","兔尾巴"],["cat-tail","猫尾巴"],["leather-chain","细银链"]]],["legs","腿上",[["maid-stockings","黑丝"],["bunny-fishnet","渔网袜"],["nurse-stockings","白丝"],["lingerie-stockings","粉丝袜"],["dream-socks","蓝色睡袜"]]],["face","腮红",[["maid-blush","腮红"],["blush-heavy","腮红加倍"],["blush-lines","害羞斜线"],["blush-hearts","爱心腮红"],["blush-freckles","小雀斑"]]]];const A='assets/wardrobe/';const ORDER=['back','legs','body','neck','hand','eyes','face','eyewear','head'];let state=JSON.parse(localStorage.getItem('clawd-public-wardrobe')||'{}'),cur='preset';
const character=document.querySelector('#character'),tabs=document.querySelector('#tabs'),grid=document.querySelector('#grid');
function save(){localStorage.setItem('clawd-public-wardrobe',JSON.stringify(state))}function renderCharacter(){character.innerHTML='';for(const n of ['base-legs.png','base-body.png']){let i=new Image;i.src=A+n;i.className='base';character.append(i)}for(const slot of ORDER){if(!state[slot])continue;let i=new Image;i.src=A+state[slot]+'.svg';i.className='sel';i.alt='';character.append(i)}}
function renderTabs(){let x=tabs.scrollLeft;tabs.innerHTML='';for(const s of SLOTS){let b=document.createElement('button');b.textContent=s[1];b.className=s[0]===cur?'on':'';b.onclick=()=>{cur=s[0];renderTabs();renderGrid();b.scrollIntoView({inline:'nearest',block:'nearest'})};tabs.append(b)}tabs.scrollLeft=x}
function renderGrid(){let slot=SLOTS.find(x=>x[0]===cur);grid.innerHTML='';let none=document.createElement('button');none.className='item'+(cur!=='preset'&&!state[cur]?' on':'');none.textContent=cur==='preset'?'全部脱掉':cur==='eyes'?'原来眼睛':cur==='face'?'不涂':'不戴';none.onclick=()=>{if(cur==='preset')state={};else{delete state._preset;delete state[cur]}save();render()};grid.append(none);for(const [id,label] of slot[2]){let b=document.createElement('button');b.className='item'+((cur==='preset'?state._preset===id:state[cur]===id)?' on':'');b.textContent=label;b.onclick=()=>{if(cur==='preset')state={_preset:id,...PRESETS[id]};else{delete state._preset;if(state[cur]===id)delete state[cur];else state[cur]=id}save();render()};grid.append(b)}}function render(){renderCharacter();renderTabs();renderGrid()}render();
</script></body></html>
